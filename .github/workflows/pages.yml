name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: index.html
      - uses: actions/deploy-pages@v1
